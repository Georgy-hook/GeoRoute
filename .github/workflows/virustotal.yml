name: VirusTotal release audit

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to inspect (no rebuild)
        required: true
        default: v0.4.0
  push:
    branches: [codex/virustotal-release-audit]
    paths:
      - .github/workflows/virustotal.yml
      - tools/scan_virustotal_release.py

permissions:
  contents: read

concurrency:
  group: virustotal-release-audit
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Inspect exact published files with VirusTotal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v0.4.0' }}
          VTAI_TOKEN: ${{ secrets.VTAI_AGENT_TOKEN }}
          VTAI_BOOTSTRAP_PUBLIC_KEY: ${{ vars.VTAI_BOOTSTRAP_PUBLIC_KEY }}
        run: python tools/scan_virustotal_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virustotal-release-audit
          path: scan-results/
          if-no-files-found: warn
          retention-days: 30
