name: GeoRoute Windows

on:
  push:
    paths:
      - 'clients/windows/**'
      - '.github/workflows/windows-client.yml'
  pull_request:
    paths:
      - 'clients/windows/**'
      - '.github/workflows/windows-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Protocol, recovery and UI checks
        run: .\clients\windows\tests\Run-Tests.ps1 -PythonExe python.exe
      - name: Build portable client
        run: .\clients\windows\Build.ps1 -PythonExe python.exe
      - name: Verify independent launcher rebuild
        run: |
          $archive=@(Get-ChildItem clients/windows/dist -Filter '*.zip')
          if($archive.Count -ne 1){throw 'Expected one client archive'}
          .\clients\windows\tests\Test-LauncherReproducibility.ps1 -ArchivePath $archive[0].FullName
      - uses: actions/upload-artifact@v4
        with:
          name: GeoRoute-Windows
          path: clients/windows/dist/*
  audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/bridge-lifecycle' && contains(github.event.head_commit.message, '[audit-client]')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: GeoRoute-Windows
          path: client-candidate/
      - name: Inspect exact client candidate with VirusTotal
        env:
          VTAI_TOKEN: ${{ secrets.VTAI_AGENT_TOKEN }}
        run: python tools/scan_windows_candidate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-candidate-virustotal
          path: scan-results/
          if-no-files-found: warn
          retention-days: 30
