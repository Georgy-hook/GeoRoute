name: GeoRoute Windows

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    paths:
      - 'clients/windows/**'
      - 'tools/scan_windows_candidate.py'
      - '.github/workflows/windows-client.yml'
  pull_request:
    paths:
      - 'clients/windows/**'
      - '.github/workflows/windows-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Protocol, recovery and UI checks
        run: .\clients\windows\tests\Run-Tests.ps1 -PythonExe python.exe
      - name: Build portable client
        run: .\clients\windows\Build.ps1 -PythonExe python.exe
      - name: Build ordinary Windows installer
        run: |
          # Use the currently recommended upstream compiler, not runner's older 6.x.
          $compiler=Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $compiler
          if((Get-FileHash -LiteralPath $compiler).Hash -ine '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'){throw 'Upstream compiler digest mismatch'}
          $signature=Get-AuthenticodeSignature -LiteralPath $compiler
          if($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.'){throw 'Upstream compiler signature mismatch'}
          $compilerRoot=Join-Path $env:RUNNER_TEMP 'InnoSetup7'
          $install=Start-Process -FilePath $compiler -ArgumentList ('/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="'+$compilerRoot+'"') -Wait -PassThru
          if($install.ExitCode -ne 0){throw 'Upstream compiler setup failed'}
          .\clients\windows\Build-Installer.ps1 -PythonExe python.exe -CompilerPath (Join-Path $compilerRoot 'ISCC.exe')
      - name: Install, upgrade, launch and uninstall in disposable runner
        run: .\clients\windows\tests\Test-Installer.ps1 -SetupPath (Resolve-Path clients/windows/dist/GeoRoute-Setup-*-x64.exe).Path -ArchivePath (Resolve-Path clients/windows/dist/*.zip).Path
      - uses: actions/upload-artifact@v4
        with:
          name: GeoRoute-Windows
          path: clients/windows/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: installer-test-evidence
          path: clients/windows/installer-test-evidence/
  audit:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/release/')) && contains(github.event.head_commit.message, '[audit-client]')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: GeoRoute-Windows
          path: client-candidate/
      - uses: actions/download-artifact@v4
        with:
          name: installer-test-evidence
          path: installer-test-evidence/
      - name: Inspect exact client candidate with VirusTotal
        env:
          VTAI_TOKEN: ${{ secrets.VTAI_AGENT_TOKEN }}
        run: python tools/scan_windows_candidate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-candidate-virustotal
          path: scan-results/
          if-no-files-found: warn
          retention-days: 30
